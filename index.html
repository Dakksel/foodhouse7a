<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food House — Меню</title>
<meta name="description" content="Food House — донер, шаурма, бургер, пицца, чикен. Доставка по городу.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="photos/logo.jpg">
</head>
<body>

<header class="top">
  <div class="logo-wrap">
    <img src="photos/logo.jpg" alt="Food House" class="logo-img">
    <div>
      <p class="tagline">Донер · Бургер · Пицца · Чикен · Твистер</p>
    </div>
  </div>
  <button class="cart-btn" id="cartBtn" aria-label="Открыть корзину">
    <span class="cart-icon">🛒</span>
    <span class="cart-badge" id="cartBadge">0</span>
    <span class="cart-total" id="cartTotal">0 ₸</span>
  </button>
</header>

<nav class="cats" id="cats"></nav>

<main class="menu" id="menu"></main>

<!-- CART DRAWER -->
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>Ваш заказ</h2>
    <button class="close" id="closeDrawer" aria-label="Закрыть">×</button>
  </div>
  <div class="drawer-body">
    <ul class="cart-list" id="cartList"></ul>
    <p class="empty" id="emptyMsg">Корзина пуста. Добавьте что-нибудь вкусное 🍔</p>

    <div class="form" id="orderForm">
      <h3>Оформление</h3>
      <label>
        Полное имя
        <input type="text" id="custName" placeholder="Иван Иванов" autocomplete="name" required>
      </label>
      <label>
        Адрес доставки
        <input type="text" id="custAddress" placeholder="ул. Абая 10, кв 25" required>
      </label>
      <label>
        Код домофона / подъезд / этаж
        <input type="text" id="custGate" placeholder="Домофон: 1234, подъезд 2, этаж 5">
      </label>
      <label>
        Способ оплаты
        <select id="custPay" required>
          <option value="Kaspi перевод">Kaspi перевод</option>
          <option value="Наличными">Наличными</option>
        </select>
      </label>
      <label>
        Комментарий к заказу (необязательно)
        <textarea id="custNote" rows="2" placeholder="Без лука, острый соус отдельно…"></textarea>
      </label>

      <div class="totals">
        <div><span>Сумма</span><b id="subTotal">0 ₸</b></div>
        <div><span>Доставка</span><b id="deliveryFee">—</b><small id="deliveryHint" class="hint-inline"></small></div>
        <div class="grand"><span>Итого</span><b id="grandTotal">0 ₸</b></div>
      </div>

      <button class="send-btn" id="sendBtn">📲 Отправить заказ в WhatsApp</button>
      <p class="hint">Откроется WhatsApp с готовым текстом заказа на номер <b>+7 705 136 76 85</b>.</p>
    </div>
  </div>
</aside>
<div class="overlay" id="overlay"></div>

<footer class="footer">
  <div>© Food House · Доставка по городу</div>
  <div>📞 +7 705 136 76 85</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>const db = firebase.firestore();</script>
<script src="menu-data.js"></script>
<script src="script.js"></script>
</body>
</html>
